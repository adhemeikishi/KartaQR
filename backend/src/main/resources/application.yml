server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: qr-menu-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qrmenu}
    username: ${DB_USER:qrmenu}
    password: ${DB_PASSWORD:qrmenu}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Configuration spécifique au produit QR Menu.
# base-url = domaine utilisé DANS le QR (ne jamais hardcoder ça dans le code Java).
qr:
  base-url: ${QR_BASE_URL:http://localhost:8080}
  # Chemin exposé publiquement pour la redirection, ex: /q/{code}
  redirect-path: /q
  image:
    default-png-size: 1000

# Auth minimale pour la V1 (basic auth sur /api/admin/**).
# À remplacer par une vraie solution (JWT, OAuth2...) plus tard - voir SecurityConfig.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:changeme}
